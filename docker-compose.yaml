services:
  inventory:
    image: node:22-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    expose:
      - "8080"
    command:
      - node
      - -e
      - |
        const http=require('http');
        const socket='/var/run/docker.sock';
        function query(){
          return new Promise((resolve,reject)=>{
            const r=http.request({socketPath:socket,path:'/containers/json?all=1',method:'GET'},res=>{
              const chunks=[];
              res.on('data',c=>chunks.push(c));
              res.on('end',()=>{
                try{resolve(JSON.parse(Buffer.concat(chunks).toString('utf8')||'[]'))}
                catch(e){reject(e)}
              });
            });
            r.on('error',reject); r.end();
          });
        }
        function pick(labels={}){
          const out={};
          for(const [k,v] of Object.entries(labels)){
            if(k==='com.docker.compose.project' ||
               k==='com.docker.compose.service' ||
               k==='coolify.applicationId' ||
               k==='coolify.serviceId' ||
               k.startsWith('traefik.http.routers.')){
              out[k]=String(v).slice(0,500);
            }
          }
          return out;
        }
        http.createServer(async(req,res)=>{
          if((req.url||'').split('?')[0]!='/health'){
            res.writeHead(404,{'content-type':'application/json'});
            return res.end('{"status":"not_found"}');
          }
          let payload;
          try{
            const rows=(await query()).filter(x=>{
              const names=(x.Names||[]).join(',');
              const labels=JSON.stringify(x.Labels||{});
              return names.includes('vps-terminal') || labels.includes('vps-terminal');
            }).map(x=>({
              id:String(x.Id||'').slice(0,12),
              names:x.Names||[],
              image:String(x.Image||''),
              state:String(x.State||''),
              status:String(x.Status||''),
              labels:pick(x.Labels||{})
            }));
            payload={status:'ok',service:'vps-terminal-inventory',count:rows.length,containers:rows};
          }catch(e){
            payload={status:'error',service:'vps-terminal-inventory',error:String(e?.message||e).slice(0,300)};
          }
          const body=Buffer.from(JSON.stringify(payload));
          res.writeHead(200,{'content-type':'application/json','content-length':body.length,'cache-control':'no-store'});
          res.end(body);
        }).listen(8080,'0.0.0.0');
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.vt-native-inventory.entrypoints=https
      - "traefik.http.routers.vt-native-inventory.rule=Host(`vps-terminal.srv1904412.hstgr.cloud`) && Path(`/health`)"
      - traefik.http.routers.vt-native-inventory.tls=true
      - traefik.http.routers.vt-native-inventory.tls.certresolver=letsencrypt
      - traefik.http.routers.vt-native-inventory.priority=5000000
      - traefik.http.routers.vt-native-inventory.service=vt-native-inventory
      - traefik.http.services.vt-native-inventory.loadbalancer.server.port=8080

networks:
  coolify:
    external: true
