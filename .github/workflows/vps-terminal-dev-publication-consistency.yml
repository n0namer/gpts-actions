name: vps-terminal-dev-publication-consistency

on:
  pull_request:
    paths:
      - "actions/vps-terminal-dev.openapi.json"
      - "actions/vps-terminal-dev-approval.openapi.json"
      - "scripts/validate-vps-terminal-dev-publication.mjs"
      - "scripts/validate-vps-terminal-dev-approval-publication.mjs"
      - ".github/workflows/vps-terminal-dev-publication-consistency.yml"
  push:
    branches:
      - main
    paths:
      - "actions/vps-terminal-dev.openapi.json"
      - "actions/vps-terminal-dev-approval.openapi.json"
      - "scripts/validate-vps-terminal-dev-publication.mjs"
      - "scripts/validate-vps-terminal-dev-approval-publication.mjs"
      - ".github/workflows/vps-terminal-dev-publication-consistency.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate VPS Terminal DEV publication contract
        run: node scripts/validate-vps-terminal-dev-publication.mjs
