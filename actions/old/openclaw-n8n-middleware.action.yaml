        "type": "object",
        "required": [
          "project_prefix",
          "message"
        ],
        "additionalProperties": false,
        "properties": {
          "project_prefix": {
            "type": "string",
            "enum": [
              "PRJ-014_CALMDOWN"
            ],
            "description": "Single project identifier. MVP supports PRJ-014_CALMDOWN only. Later this will be used to locate the project registry, spreadsheet, pipeline sheet, events sheet, and current stage."
          },
          "message": {
            "type": "string",
            "description": "The user message or instruction from the current chat turn."
          },
          "turn_type": {
            "type": "string",
            "enum": [
              "user_message",
              "continue",
              "status_check",
              "review_last_result"
            ],
            "default": "user_message",
            "description": "Type of input signal. This is not a process command; the workflow resolves the internal mode itself."
          },
          "provider": {
            "type": "string",
            "enum": [
              "stub",
              "deepseek"
            ],
            "default": "stub",
