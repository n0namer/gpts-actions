          "before": {
            "type": "string",
            "description": "Alias for Calendar timeMax / events before this time, ISO 8601."
          },
          "eventId": {
            "type": "string",
            "description": "Google Calendar event id for event lookup, update, or delete."
          },
          "summary": {
            "type": "string",
